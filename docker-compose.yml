version: '3.8'

services:
  central-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: central_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Password123
    volumes:
      - central_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  central-server:
    build: .
    environment:
      DATABASE_URL: postgresql://admin:Password123@central-db:5432/central_db
      MODE: central
      REDIS_URL: redis://central-redis:6379/0
    depends_on:
      - central-db
      - central-redis
    ports:
      - "8000:8000"
      - "3000:8000" # Backward compatibility for the user

  central-redis:
    image: redis:7-alpine

  branch-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: branch_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Password123
    volumes:
      - branch_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  branch-server:
    build: .
    environment:
      DATABASE_URL: postgresql://admin:Password123@branch-db:5432/branch_db
      CENTRAL_URL: http://central-server:8000
      MODE: branch
      REDIS_URL: redis://branch-redis:6379/0
    depends_on:
      - branch-db
      - branch-redis
    ports:
      - "8001:8000"

  branch-redis:
    image: redis:7-alpine

volumes:
  central_db_data:
  branch_db_data:
